name: Publish fixed Registry release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Reviewed immutable release tag (for example v0.2.0)
        required: true
permissions:
  contents: read
concurrency:
  group: registry-release
  cancel-in-progress: false
jobs:
  publish:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate fixed public release
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          REPOSITORY_VISIBILITY: ${{ github.event.repository.visibility }}
        run: python scripts/check_registry_release.py
      - run: python -m pip install -e ".[dev]" comfy-cli==1.20.0
      - run: python -m pytest tests --basetemp .pytest-tmp
      - run: python -m ruff check comfyremote_connector tests
      - name: Publish to Registry
        env:
          REGISTRY_ACCESS_TOKEN: ${{ secrets.REGISTRY_ACCESS_TOKEN }}
        shell: python
        run: |
          import os, subprocess
          token = os.environ.get("REGISTRY_ACCESS_TOKEN")
          if not token:
              raise SystemExit("Configure REGISTRY_ACCESS_TOKEN before publishing")
          subprocess.run(["comfy", "--skip-prompt", "--no-enable-telemetry", "env"], check=True)
          subprocess.run(["comfy", "node", "publish", "--token", token], check=True)
